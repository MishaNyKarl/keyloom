<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyloom</title><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head><body>
  <header><strong>keyloom<span>↗</span></strong><small>ТВОЙ РИТМ ПЕЧАТИ</small></header>
  <h1>Практика с фокусом.</h1><p>Ошибки становятся подсказками<br>для следующей тренировки.</p>
  <div class="summary"><strong id="count">—</strong><span>тестов в этом браузере</span></div>
  <label><span>Записывать тесты</span><input id="enabled" type="checkbox" role="switch"></label>
  <button id="open">Мой прогресс <span>→</span></button>
  <p id="status" role="status">Данные остаются на устройстве.</p>
</body></html>
