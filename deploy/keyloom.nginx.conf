server {
  listen 8443 ssl;
  server_name 45.11.229.77;
  ssl_certificate /etc/letsencrypt/live/keyloom-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/keyloom-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 8m;
  access_log off;
  location / {
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
